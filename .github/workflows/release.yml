# Release: cross-platform build + publish on tag push.
#
# Trigger: push a tag like v0.1.0 → three native builds (macOS arm64,
# Windows amd64, Linux amd64) → one GitHub release with all archives
# + SHA256SUMS. workflow_dispatch builds the same artifacts without
# publishing (for testing the pipeline).
#
# Native runners everywhere because the MIDI driver (vendored RtMidi
# C++ via cgo) rules out easy cross-compilation. Each archive bundles
# the GUI app and the s950-tools CLI for that platform.
#
# macOS signing + notarization runs only when the signing secrets are
# configured (see RELEASING.md); without them the job still produces
# an unsigned .app (Gatekeeper right-click-Open instructions live in
# BUILDING.md).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Wire/UI version string for artifact names. ref_name is the tag on
  # tag pushes, the branch on manual runs.
  VERSION: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------
  # Gate: the full Go + frontend test suite must pass before any
  # platform build starts.
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/s950-gui/frontend/package-lock.json
      - name: Install build deps (gtk/webkit for the wails import, ALSA for rtmidi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      # Frontend first: cmd/s950-gui embeds frontend/dist
      # (//go:embed all:frontend/dist), so the Go packages don't even
      # list-resolve until a vite build has produced it. Locally this
      # never bites because dist exists from past builds; a fresh CI
      # checkout has nothing there.
      - name: Frontend build + tests + typecheck
        working-directory: cmd/s950-gui/frontend
        run: |
          npm ci
          npm run build
          npx vitest run
          npm run check
      - name: Go tests
        run: go test -tags webkit2_41 $(go list ./... | grep -v node_modules)

  # ---------------------------------------------------------------
  # macOS (Apple Silicon)
  # ---------------------------------------------------------------
  build-macos:
    runs-on: macos-14
    needs: test
    env:
      # Matches MAC_BUILD_ENV in the Makefile — see BUILDING.md.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CGO_CXXFLAGS: -Wno-vla-cxx-extension
      # Secrets aren't allowed directly in step `if:`; surfacing the
      # presence check as env is the standard workaround.
      HAVE_MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    outputs:
      # Lets the smoke job assert signatures only when they exist.
      signed: ${{ steps.sig.outputs.signed }}
    steps:
      - id: sig
        run: echo "signed=$HAVE_MAC_SIGNING" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/s950-gui/frontend/package-lock.json
      - name: Install wails CLI (version pinned to go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Build GUI (.app, darwin/arm64)
        working-directory: cmd/s950-gui
        run: wails build -platform darwin/arm64 -clean
      - name: Build CLI
        run: go build -o dist/s950-tools ./cmd/s950-tools

      - name: Import Developer ID certificate
        if: env.HAVE_MAC_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm /tmp/cert.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PWD" build.keychain

      - name: Sign (hardened runtime — required for notarization)
        if: env.HAVE_MAC_SIGNING == 'true'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --deep --force --verify --options runtime --timestamp \
            --sign "$IDENTITY" cmd/s950-gui/build/bin/s950-gui.app
          codesign --force --verify --options runtime --timestamp \
            --sign "$IDENTITY" dist/s950-tools

      - name: Notarize + staple
        if: env.HAVE_MAC_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # ditto preserves macOS metadata; plain zip strips signatures
          # and breaks notarization (see BUILDING.md).
          ditto -c -k --keepParent cmd/s950-gui/build/bin/s950-gui.app /tmp/notarize-app.zip
          xcrun notarytool submit /tmp/notarize-app.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple cmd/s950-gui/build/bin/s950-gui.app
          # The CLI gets its own submission — Gatekeeper checks
          # downloaded terminal binaries too (Catalina+). Plain
          # binaries can't be stapled; Gatekeeper verifies the
          # ticket online via the signature instead.
          ditto -c -k --keepParent dist/s950-tools /tmp/notarize-cli.zip
          xcrun notarytool submit /tmp/notarize-cli.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait

      - name: Package
        run: |
          # The zip's top-level dir is what users see after extract —
          # name it for the app, not the build step.
          STAGE=/tmp/s950-tools && mkdir -p "$STAGE"
          cp -R cmd/s950-gui/build/bin/s950-gui.app "$STAGE/"
          cp dist/s950-tools "$STAGE/"
          ditto -c -k --keepParent "$STAGE" "s950-tools_${VERSION}_macos_arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: s950-tools_*_macos_arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Windows (amd64)
  # ---------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    needs: test
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/s950-gui/frontend/package-lock.json
      - name: Install wails CLI (version pinned to go.mod)
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Build GUI (windows/amd64)
        working-directory: cmd/s950-gui
        shell: bash
        run: wails build -platform windows/amd64 -clean
      - name: Build CLI
        shell: bash
        run: go build -o dist/s950-tools.exe ./cmd/s950-tools

      - name: Package
        shell: bash
        run: |
          STAGE=stage && mkdir -p "$STAGE"
          cp cmd/s950-gui/build/bin/s950-gui.exe "$STAGE/"
          cp dist/s950-tools.exe "$STAGE/"
          cd "$STAGE" && 7z a "../s950-tools_${VERSION}_windows_amd64.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: s950-tools_*_windows_amd64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Linux (amd64)
  # ---------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/s950-gui/frontend/package-lock.json
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - name: Install wails CLI (version pinned to go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Build GUI (linux/amd64)
        working-directory: cmd/s950-gui
        # ubuntu-latest (24.04) ships webkit2gtk 4.1 only; the wails
        # webkit2_41 build tag targets it. Users need the runtime
        # packages (libwebkit2gtk-4.1, libgtk-3, libasound2).
        run: wails build -platform linux/amd64 -clean -tags webkit2_41
      - name: Build CLI
        run: go build -o dist/s950-tools ./cmd/s950-tools

      - name: Package
        run: |
          STAGE=$(mktemp -d)
          cp cmd/s950-gui/build/bin/s950-gui "$STAGE/"
          cp dist/s950-tools "$STAGE/"
          tar -C "$STAGE" -czf "s950-tools_${VERSION}_linux_amd64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: s950-tools_*_linux_amd64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Artifact smoke tests: each job downloads the archive a user
  # would, extracts it the way a user would, and runs the binaries.
  # Deliberately separate from the build jobs — this is what catches
  # packaging bugs (lost exec bits, signature-stripping zips, deps
  # that existed on the build runner but not on a clean box).
  # testdata/smoke.img is a synthetic fixture (our own builders).
  # ---------------------------------------------------------------
  smoke-macos:
    runs-on: macos-14
    needs: build-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - name: Extract like a user
        run: ditto -x -k s950-tools_*_macos_arm64.zip extracted
      - name: CLI smoke
        run: |
          extracted/s950-tools/s950-tools --help > /dev/null
          extracted/s950-tools/s950-tools image-inspect testdata/smoke.img
      - name: Signature + notarization assertions
        if: needs.build-macos.outputs.signed == 'true'
        run: |
          codesign --verify --deep --strict extracted/s950-tools/s950-gui.app
          spctl --assess --type execute -vv extracted/s950-tools/s950-gui.app
          xcrun stapler validate extracted/s950-tools/s950-gui.app
          codesign --verify --strict extracted/s950-tools/s950-tools

  smoke-windows:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Extract + CLI smoke
        shell: bash
        run: |
          7z x s950-tools_*_windows_amd64.zip -oextracted
          extracted/s950-tools.exe --help > /dev/null
          extracted/s950-tools.exe image-inspect testdata/smoke.img

  smoke-linux:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install runtime deps (what a user's desktop would have)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 libasound2t64 \
            xvfb dbus-x11
      - name: Extract + CLI smoke
        run: |
          mkdir extracted && tar -C extracted -xzf s950-tools_*_linux_amd64.tar.gz
          extracted/s950-tools --help > /dev/null
          extracted/s950-tools image-inspect testdata/smoke.img
      - name: GUI links cleanly
        run: |
          ldd extracted/s950-gui | tee /tmp/ldd.out
          ! grep "not found" /tmp/ldd.out
      # Launch smoke under a virtual display: surviving the timeout
      # (124) or exiting on SIGTERM (143/0) means the app booted its
      # webview without crashing. Informational until it's proven
      # stable across a few runs — flip continue-on-error off then.
      - name: GUI launch smoke (xvfb)
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM 10 dbus-run-session -- xvfb-run -a extracted/s950-gui
          rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 124 ] || [ "$rc" -eq 143 ] || [ "$rc" -eq 0 ]

  # ---------------------------------------------------------------
  # Linux distro matrix: the same binary against different userlands
  # via Docker (containers share the kernel, so this is Linux-only —
  # it can't validate Windows/macOS). Catches glibc-floor breaks and
  # runtime package naming drift. The older distros are canaries
  # (continue-on-error): the binary is built on ubuntu-24.04 / glibc
  # 2.39, so they're EXPECTED to fail until the support floor is
  # deliberately lowered (build in an older container to fix).
  # ---------------------------------------------------------------
  smoke-linux-distros:
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ALSA runtime package was renamed libasound2 →
          # libasound2t64 in the time64 transition; the fallback
          # install covers both spellings per distro.
          - image: ubuntu:24.04
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0 libwebkit2gtk-4.1-0 && (apt-get install -y --no-install-recommends libasound2t64 || apt-get install -y --no-install-recommends libasound2)
            required: true
          - image: debian:13
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0 libwebkit2gtk-4.1-0 && (apt-get install -y --no-install-recommends libasound2t64 || apt-get install -y --no-install-recommends libasound2)
            required: true
          - image: fedora:latest
            setup: dnf install -y alsa-lib gtk3 webkit2gtk4.1
            required: true
          - image: ubuntu:22.04
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0 libwebkit2gtk-4.1-0 libasound2
            required: false
          - image: debian:12
            setup: apt-get update && apt-get install -y --no-install-recommends libgtk-3-0 libwebkit2gtk-4.1-0 libasound2
            required: false
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Extract
        run: mkdir extracted && tar -C extracted -xzf s950-tools_*_linux_amd64.tar.gz
      - name: CLI + linkage smoke in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.image }} bash -ec '
            ${{ matrix.setup }}
            extracted/s950-tools --help > /dev/null
            extracted/s950-tools image-inspect testdata/smoke.img
            ldd extracted/s950-gui | tee /tmp/ldd.out
            ! grep "not found" /tmp/ldd.out
          '

  # ---------------------------------------------------------------
  # Publish: one release with every platform's archive + checksums.
  # A single job (rather than per-build release steps) avoids three
  # concurrent create-release races. Skipped on workflow_dispatch.
  # ---------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [smoke-macos, smoke-windows, smoke-linux, smoke-linux-distros]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
